name: Actualizar partidos

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 9-22/2 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Generar partidos
        run: python partidos_whatsapp.py --json partidos.json --estado estado.json

      - name: Guardar resultado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add partidos.json estado.json
          git diff --cached --quiet || git commit -m "Actualizar partidos"
          git push
